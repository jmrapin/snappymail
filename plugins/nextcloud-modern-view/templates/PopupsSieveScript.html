<!--
	Nextcloud Modern View: one Sieve script and its rules (replaces core's PopupsSieveScript).
	The rules stay a table: core's sortableItem binding reorders parent.rows, and core opens a rule
	on a click in td.e-action (Sieve/View/Script.js onBuild). Helpers: js/filters.js,
	styles: css/filters.css.
-->
<!-- ko with: script -->
<header>
	<a href="#" class="close" data-bind="click: $root.close">×</a>
	<h3>
		<span data-i18n="POPUPS_SIEVE_SCRIPT/TITLE_CREATE" data-bind="visible: !exists()"></span>
		<span data-bind="visible: exists, text: $root.mvScriptTitle"></span>
	</h3>
</header>
<form class="modal-body mv-flt-script" spellcheck="false">

	<div class="control-group mv-flt-field" data-bind="css: { 'error': nameError }, hidden: exists">
		<input type="text" data-bind="value: name" autocorrect="off" autocapitalize="off"
			data-i18n="[placeholder]GLOBAL/NAME">
	</div>

	<div class="mv-flt-alert" data-bind="visible: hasChanges">
		<span data-i18n="POPUPS_SIEVE_SCRIPT/CHANGES_NEED_TO_BE_SAVED_DESC"></span>
	</div>
	<div class="alert alert-error g-ui-user-select-none" style="white-space:pre" data-bind="visible: $root.errorText, text: $root.errorText" data-icon="⚠"></div>

	<!-- raw Sieve, as core shows it -->
	<div class="control-group" data-bind="visible: $root.rawActive">
		<details>
			<summary data-i18n="POPUPS_SIEVE_SCRIPT/CAPABILITY_LABEL"></summary>
			<pre data-bind="text: $root.sieveCapabilities"></pre>
		</details>
		<details>
			<summary>Actions</summary>
			<pre data-bind="text: $root.availableActions"></pre>
		</details>
		<details>
			<summary>Controls</summary>
			<pre data-bind="text: $root.availableControls"></pre>
		</details>
		<details>
			<summary>Tests</summary>
			<pre data-bind="text: $root.availableTests"></pre>
		</details>
		<textarea class="mv-flt-raw" data-bind="value: body, valueUpdate: 'input'"></textarea>
	</div>

	<div data-bind="visible: !$root.rawActive()">
		<p class="mv-flt-intro" data-bind="text: $root.mvT('MODERN_VIEW/FILTERS_RULES_INTRO')"></p>
		<div class="mv-flt-empty" data-bind="visible: $root.mvNoRules, text: $root.mvT('MODERN_VIEW/FILTERS_NO_RULES')"></div>
		<table class="mv-rules filters-list g-ui-user-select-none">
			<tbody data-bind="foreach: filters, i18nUpdate: filters">
				<tr class="filter-item" draggable="true" data-bind="sortableItem: { list: $parent.filters }, css: { 'mv-off': !enabled() }">
					<td class="mv-rule-drag drag-handle" data-bind="attr: { title: $root.mvT('MODERN_VIEW/FILTERS_DRAG') }"><span class="mv-grip"></span></td>
					<td class="mv-rule-sw">
						<a href="#" class="mv-switch" data-bind="click: $root.mvToggleRule, css: { on: enabled }, attr: { title: $root.mvT('MODERN_VIEW/FILTERS_ON_OFF') }"></a>
					</td>
					<td class="e-action mv-rule-main">
						<div class="filter-name mv-flt-name" data-bind="text: name"></div>
						<div class="filter-sub-name mv-flt-sub" data-bind="text: $root.mvRuleSub($data)"></div>
					</td>
					<td class="mv-rule-act">
						<a href="#" class="mv-btn" data-bind="visible: !askDelete(), click: $root.mvEditRule, attr: { title: $root.mvT('MODERN_VIEW/FILTERS_EDIT') }"><i class="mi mi-edit"></i></a>
						<a href="#" class="mv-btn mv-danger" data-bind="visible: !askDelete(), click: $root.mvAskDeleteRule, attr: { title: $root.mvT('GLOBAL/DELETE') }"><i class="mi mi-delete"></i></a>
						<a href="#" class="mv-sbtn mv-sbtn-danger" data-bind="visible: askDelete, click: $root.mvDeleteRule, text: $root.mvT('GLOBAL/ARE_YOU_SURE')"></a>
					</td>
				</tr>
			</tbody>
		</table>
		<a href="#" class="mv-sbtn mv-flt-add" data-bind="visible: allowFilters, click: $root.mvAddRule"><span class="mv-plus">+</span><span data-bind="text: $root.mvT('MODERN_VIEW/FILTERS_ADD_RULE')"></span></a>
	</div>
</form>
<footer class="mv-flt-footer">
	<a href="#" class="mv-sbtn mv-sbtn-ghost" data-bind="visible: allowFilters(), click: $root.mvToggleRaw, css: { 'mv-on': $root.rawActive }">
		<i class="mi mi-code"></i><span data-bind="text: $root.mvT('MODERN_VIEW/FILTERS_RAW')"></span>
	</a>
	<span class="mv-spacer"></span>
	<a href="#" class="mv-sbtn" data-bind="click: $root.close, text: $root.mvT('GLOBAL/CLOSE')"></a>
	<a href="#" class="mv-sbtn mv-sbtn-primary" data-bind="click: $root.mvSave, css: { 'mv-sbtn-error': $root.saveError }">
		<i class="icon-spinner" data-bind="visible: $root.saving"></i>
		<span data-bind="text: $root.mvT('GLOBAL/SAVE')"></span>
	</a>
</footer>
<!-- /ko -->
