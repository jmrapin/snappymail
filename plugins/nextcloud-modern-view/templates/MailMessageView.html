<!--
	Nextcloud Modern View: replaces the built-in MailMessageView template.
	Based on SnappyMail's app/templates/Views/User/MailMessageView.html (v3.0.1).
	Changes: actions toolbar (Reply / Reply all / Forward, Archive / Spam / Delete / Move,
	prev / next, the ☰ menu) with outline icons; no floating reply/☰ buttons on the message;
	no × next to the subject. The close button is hidden by CSS in the side-by-side layout.
-->
<div class="top-toolbar g-ui-user-select-none btn-toolbar mv-toolbar" data-bind="css: { 'mv-has-message': message }">
	<a class="mv-btn buttonClose" data-bind="click: closeMessage" data-i18n="[title]GLOBAL/CLOSE"><i class="mi mi-close"></i></a>
	<div class="mv-group mv-replies" data-bind="visible: canBeRepliedOrForwarded, css: {'mv-replyall-first': 2 == msgDefaultAction()}">
		<a class="mv-btn mv-primary mv-reply" data-bind="command: replyCommand" data-i18n="[title]MESSAGE/BUTTON_REPLY"><i class="mi mi-reply"></i><span class="mv-lbl" data-i18n="MESSAGE/BUTTON_REPLY"></span></a>
		<a class="mv-btn mv-primary mv-replyall" data-bind="command: replyAllCommand" data-i18n="[title]MESSAGE/BUTTON_REPLY_ALL"><i class="mi mi-reply-all"></i><span class="mv-lbl" data-i18n="MESSAGE/BUTTON_REPLY_ALL"></span></a>
		<a class="mv-btn mv-primary mv-forward" data-bind="command: forwardCommand" data-i18n="[title]MESSAGE/BUTTON_FORWARD"><i class="mi mi-forward"></i><span class="mv-lbl" data-i18n="MESSAGE/BUTTON_FORWARD"></span></a>
	</div>
	<a class="mv-btn mv-primary buttonEdit" data-bind="visible: isDraftFolder(), command: editCommand" data-i18n="[title]MESSAGE/BUTTON_EDIT"><i class="mi mi-edit"></i><span class="mv-lbl" data-i18n="MESSAGE/BUTTON_EDIT"></span></a>
	<span class="mv-sep" data-bind="visible: message"></span>
	<div class="mv-group" data-bind="visible: message">
		<a class="mv-btn" data-bind="visible: archiveAllowed, command: archiveCommand" data-i18n="[title]GLOBAL/TO_ARCHIVE"><i class="mi mi-archive"></i></a>
		<a class="mv-btn" data-bind="visible: canMarkAsSpam, command: spamCommand" data-i18n="[title]GLOBAL/TO_SPAM"><i class="mi mi-report"></i></a>
		<a class="mv-btn" data-bind="visible: isSpamFolder, command: notSpamCommand" data-i18n="[title]GLOBAL/NOT_SPAM"><i class="mi mi-mark-email-read"></i></a>
		<a class="mv-btn mv-danger" data-bind="visible: !canBeUndeleted(), command: deleteCommand" data-i18n="[title]GLOBAL/DELETE"><i class="mi mi-delete"></i></a>
		<a class="mv-btn" data-bind="visible: canBeUndeleted, command: undeleteCommand" data-i18n="[title]GLOBAL/UNDELETE"><i class="mi mi-delete mv-rotate"></i></a>
		<a class="mv-btn" data-bind="command: moveCommand" data-i18n="[title]GLOBAL/MOVE_TO"><i class="mi mi-drive-file-move"></i></a>
	</div>
	<span class="mv-spacer"></span>
	<div class="mv-group" data-bind="visible: message">
		<a class="mv-btn buttonUp" data-bind="command: goUpCommand"><i class="mi mi-chevron-left"></i></a>
		<a class="mv-btn buttonDown" data-bind="command: goDownCommand"><i class="mi mi-chevron-right"></i></a>
	</div>
	<div class="btn-group mv-more" data-bind="visible: message, registerBootstrapDropdown: true, initDom: actionsMenu">
		<a class="mv-btn dropdown-toggle" id="more-view-dropdown-id" href="#" tabindex="-1" data-i18n="[title]GLOBAL/MORE"><i class="mi mi-menu"></i></a>
		<menu class="dropdown-menu right-edge mv-menu" role="menu" aria-labelledby="more-view-dropdown-id">
			<div data-bind="visible: !isDraftFolder()">
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="command: forwardAsAttachmentCommand"><i class="mi mi-attach-email"></i><span data-i18n="MESSAGE/BUTTON_FORWARD_AS_ATTACHMENT"></span></a>
				</li>
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="command: editAsNewCommand"><i class="mi mi-edit"></i><span data-i18n="MESSAGE/BUTTON_EDIT_AS_NEW"></span></a>
				</li>
			</div>
			<div class="dividerbar">
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="click: setUnseen"><i class="mi mi-mark-email-unread"></i><span data-i18n="MESSAGE_LIST/MENU_UNSET_SEEN"></span></a>
				</li>
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="command: copyCommand"><i class="mi mi-content-copy"></i><span data-i18n="GLOBAL/COPY_TO"></span></a>
				</li>
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="command: deleteWithoutMoveCommand"><i class="mi mi-delete"></i><span data-i18n="MESSAGE_LIST/BUTTON_DELETE_WITHOUT_MOVE"></span></a>
				</li>
				<li role="presentation" data-bind="visible: firstUnsubsribeLink">
					<a target="_blank" href="#" tabindex="-1" data-bind="attr: { href: firstUnsubsribeLink }"><i class="mi mi-unsubscribe"></i><span data-i18n="MESSAGE/BUTTON_UNSUBSCRIBE"></span></a>
				</li>
			</div>
			<!-- ko if: tagsAllowed -->
			<div class="dividerbar mv-menu-tags">
				<!-- ko foreach: message()?.tagOptions() || [] -->
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="click: toggle, attr: { title: value }"><i class="mi" data-bind="css: checked ? 'mi-check-box' : 'mi-check-box-outline-blank'"></i><span data-bind="text: label, attr: { class: css }"></span></a>
				</li>
				<!-- /ko -->
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="click: newTag"><i class="mi mi-label"></i><span data-bind="text: mvT('MESSAGE/NEW_TAG')"></span></a>
				</li>
			</div>
			<!-- /ko -->
			<div class="dividerbar">
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="click: () => message()?.printMessage()"><i class="mi mi-print"></i><span data-i18n="MESSAGE/MENU_PRINT"></span></a>
				</li>
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="click: () => message()?.popupMessage()"><i class="mi mi-open-in-new"></i><span data-i18n="MESSAGE/BUTTON_IN_NEW_WINDOW"></span></a>
				</li>
				<li role="presentation" data-bind="visible: message()?.html() && !message()?.isHtml()">
					<a href="#" tabindex="-1" data-bind="click: () => message()?.viewHtml()"><i class="mi mi-visibility"></i><span data-i18n="MESSAGE/HTML_VIEW"></span></a>
				</li>
				<li role="presentation" data-bind="visible: message()?.isHtml()">
					<a href="#" tabindex="-1" data-bind="click: () => message()?.viewPlain()"><i class="mi mi-article"></i><span data-i18n="MESSAGE/PLAIN_VIEW"></span></a>
				</li>
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="click: () => message()?.swapColors()"><i class="mi mi-visibility"></i><span data-i18n="MESSAGE/SWAP_COLORS"></span></a>
				</li>
				<li role="presentation">
					<a href="#" tabindex="-1" data-bind="click: toggleFullScreen"><i class="mi mi-fullscreen"></i><span data-i18n="SHORTCUTS_HELP/LABEL_FULLSCREEN_TOGGLE"></span></a>
				</li>
			</div>
			<div class="dividerbar">
				<li role="presentation">
					<a target="_blank" href="#" tabindex="-1" data-bind="attr: { href: message()?.viewRaw() }"><i class="mi mi-code"></i><span data-i18n="MESSAGE/MENU_VIEW_ORIGINAL"></span></a>
				</li>
				<li role="presentation">
					<a target="_blank" href="#" tabindex="-1" data-bind="attr: { href: message()?.downloadLink() }"><i class="mi mi-download"></i><span data-i18n="MESSAGE/MENU_DOWNLOAD_ORIGINAL"></span></a>
				</li>
			</div>
		</menu>
	</div>
</div>
<div class="messageView">
	<div class="b-message-view-backdrop" data-bind="visible: moveAction">
		<div class="backdrop-message" data-icon="📁" data-i18n="MESSAGE/MESSAGE_VIEW_MOVE_DESC"></div>
	</div>
	<div class="b-message-view-checked-helper" data-bind="visible: !message() && '' === messageError() && hasCheckedMessages(), text: printableCheckedMessageCount()"></div>

	<div class="b-message-view-desc error" data-bind="visible: !message() && '' !== messageError() && !hasCheckedMessages(), text: messageError()">
	</div>

	<div class="b-message-view-desc" data-i18n="MESSAGE/MESSAGE_VIEW_DESC" data-bind="visible: !message() && '' === messageError() && !hasCheckedMessages()">
	</div>

	<div class="b-message" data-bind="visible: message, i18nUpdate: message, css: message()?.lineAsCss(0)">

		<div class="messageItemHeader mv-header" data-bind="if: message, i18nUpdate: message">
			<div class="subjectParent mv-subject-row">
				<span class="subject mv-subject" data-bind="text: message().subject, attr: { title: message().subject }"></span>
				<span class="mv-subject-icons">
					<span class="mv-shield" tabindex="0" data-bind="visible: mvAuth().show, css: mvAuth().level">
						<i class="mi" data-bind="css: mvAuth().icon"></i>
						<span class="mv-shield-panel">
							<span class="mv-shield-head" data-bind="text: mvAuth().head"></span>
							<!-- ko if: mvAuth().local -->
							<span class="mv-shield-row"><b class="mv-y">✔</b><span class="mv-wide" data-bind="text: mvT('MODERN_VIEW/DELIVERED_LOCALLY')"></span></span>
							<!-- /ko -->
							<!-- ko foreach: mvAuth().rows -->
							<span class="mv-shield-row" data-bind="attr: { title: title }"><b data-bind="text: mark, css: cls"></b><span data-bind="text: name"></span><span class="mv-why" data-bind="text: why"></span></span>
							<!-- /ko -->
						</span>
					</span>
					<span class="flagParent mv-star" data-bind="css: { flagOn: message().isFlagged() }"><i class="mi" data-bind="css: message().isFlagged() ? 'mi-star-fill' : 'mi-star'"></i></span>
				</span>
			</div>
			<div class="mv-from">
				<span class="mv-name" data-bind="text: mvFromName, attr: { title: message().from }"></span>
				<span class="mv-addr" data-bind="text: mvFromAddr, visible: mvFromAddr"></span>
			</div>
			<time class="mv-date" data-time-format="AUTO" data-bind="visible: 0 < message().dateTimestamp(), time: message().dateTimestamp()"></time>
			<div class="mv-to">
				<!-- ko if: message().to.length -->
				<span class="mv-k" data-i18n="GLOBAL/TO"></span>
				<span class="mv-recips" data-bind="text: message().to, attr: { title: message().to }"></span>
				<!-- /ko -->
				<a href="#" class="mv-details-toggle" data-bind="click: toggleFullInfo, css: { open: showFullInfo }">
					<i class="mi mi-keyboard-arrow-down"></i>
					<span data-bind="hidden: showFullInfo" data-i18n="MODERN_VIEW/DETAILS"></span>
					<span data-bind="visible: showFullInfo" data-i18n="MODERN_VIEW/HIDE_DETAILS"></span>
				</a>
			</div>
		</div>
		<div id="messageItem">
			<div class="messageItemHeader mv-header2" data-bind="if: message, i18nUpdate: message">
				<div class="mv-details" data-bind="visible: showFullInfo, with: message">
					<span class="mv-k" data-bind="visible: cc.length" data-i18n="GLOBAL/CC"></span>
					<span data-bind="visible: cc.length, text: cc"></span>
					<span class="mv-k" data-bind="visible: bcc.length" data-i18n="GLOBAL/BCC"></span>
					<span data-bind="visible: bcc.length, text: bcc"></span>
					<span class="mv-k" data-bind="visible: replyTo.length" data-i18n="GLOBAL/REPLY_TO"></span>
					<span data-bind="visible: replyTo.length, text: replyTo"></span>
					<span class="mv-k" data-bind="visible: dateTimestamp" data-i18n="MESSAGE/LABEL_DATE"></span>
					<span data-bind="visible: dateTimestamp">
						<time data-time-format="FULL" data-bind="time: dateTimestamp"></time>
						(<time data-time-format="FROMNOW" data-bind="time: dateTimestamp"></time>)
					</span>
					<span class="mv-k" data-bind="visible: friendlySize()" data-i18n="POPUPS_FILTER/SELECT_FIELD_SIZE"></span>
					<span data-bind="visible: friendlySize(), text: friendlySize()"></span>
					<span class="mv-k" data-bind="visible: spamResult" data-i18n="GLOBAL/SPAM"></span>
					<span data-bind="visible: spamResult, text: spamStatus()"></span>
				</div>
				<div class="hasVirus" data-bind="visible: message().hasVirus" data-i18n="MESSAGE/HAS_VIRUS_WARNING"></div>
				<!-- ko if: tagsAllowed -->
				<div class="messageTags mv-tags" data-bind="visible: tagsToHTML">
					<span class="messageAssignedTags" data-bind="html: tagsToHTML"></span>
				</div>
				<!-- /ko -->
			</div>
			<div tabindex="0" data-bind="hasfocus: messageDomFocused">

				<div class="loading" data-bind="visible: messageLoadingThrottle">
					<i class="icon-spinner"></i>
					<span data-i18n="GLOBAL/LOADING"></span>
				</div>

				<div data-bind="hidden: messageLoadingThrottle">
					<div class="bodySubHeader" data-bind="if: message, i18nUpdate: message">
						<div class="readReceipt" data-bind="visible: askReadReceipt, click: readReceipt"
							data-icon="✉" data-i18n="MESSAGE/BUTTON_NOTIFY_READ_RECEIPT"></div>
						<!-- Attachments (step 6): one line of cards, "Show all" opens two rows that scroll sideways together -->
						<div class="attachmentsPlace mv-atts" data-bind="visible: hasAttachments, css: { 'mv-expanded': mvAttExpanded, 'mv-selecting': mvAttSelecting }">
							<div class="mv-att-selbar" data-bind="visible: mvAttSelecting">
								<span class="mv-cb" data-bind="css: { on: mvAttAllChecked }, click: mvAttToggleAll"></span>
								<span class="mv-att-count" data-bind="text: mvAttSelectedText"></span>
								<button class="mv-sbtn mv-sbtn-primary" data-bind="click: mvAttDownloadSelected, enable: mvAttSelectedCount() > 0, visible: downloadAsZipAllowed"><i class="mi mi-download"></i><span data-bind="text: mvT('MESSAGE/LINK_DOWNLOAD_AS_ZIP')"></span></button>
								<button class="mv-sbtn" data-bind="click: mvAttSaveSelected, enable: mvAttSelectedCount() > 0, visible: mvHasNextcloud"><i class="mi mi-cloud-upload"></i><span data-bind="text: mvT('NEXTCLOUD/SAVE_ATTACHMENTS')"></span></button>
								<span class="mv-spacer"></span>
								<button class="mv-sbtn mv-sbtn-ghost" data-bind="click: mvAttCancelSelect, text: mvT('GLOBAL/CANCEL')"></button>
							</div>
							<div class="mv-att-head" data-bind="visible: mvAttExpanded() && !mvAttSelecting()">
								<span data-bind="text: mvAttSummary"></span>
								<span class="mv-spacer"></span>
								<a href="#" class="mv-lnk" data-bind="visible: downloadAsZipAllowed() && listAttachments().length > 1, click: mvAttDownloadAll"><i class="mi mi-download"></i><span data-bind="text: mvT('MODERN_VIEW/DOWNLOAD_ALL')"></span></a>
								<a href="#" class="mv-lnk" data-bind="click: mvAttCollapse"><i class="mi mi-keyboard-arrow-up"></i><span data-bind="text: mvT('MODERN_VIEW/SHOW_LESS')"></span></a>
							</div>
							<div class="mv-att-row">
								<div class="mv-att-list" data-bind="foreach: mvAttRows, event: { scroll: mvAttScrolled }">
									<div class="mv-att-line" data-bind="foreach: $data">
										<div class="mv-att" draggable="true" data-bind="
											css: { 'mv-hidden': !$root.mvAttExpanded() && !$root.mvAttSelecting() && $data.mvIndex >= $root.mvAttFit(), 'mv-sel': $root.mvAttSelecting() && $data.checked() },
											attr: { title: $data.fileName },
											event: { dragstart: $data.eventDragStart }">
											<a class="mv-att-main" target="_blank" data-bind="
												attr: { href: $data.hasPreview() ? $data.linkPreviewMain() : $data.linkDownload() },
												click: (data, event) => $root.mvAttClick($data, event)">
												<span class="mv-cb" data-bind="css: { on: $data.checked }"></span>
												<span class="mv-att-ic" data-bind="css: $root.mvAttIconClass($data), attr: { style: $data.thumbnailStyle() || '' }, text: $data.hasThumbnail() ? '' : $root.mvAttExt($data)"></span>
												<span class="mv-att-tx">
													<span class="mv-att-nm" data-bind="text: $data.fileName"></span>
													<span class="mv-att-sz" data-bind="text: $data.friendlySize()"></span>
												</span>
											</a>
											<a href="#" class="mv-att-dd" data-bind="click: (data, event) => $root.mvAttOpenMenu($data, event), attr: { title: $root.mvT('GLOBAL/MORE') }"><i class="mi mi-keyboard-arrow-down"></i></a>
										</div>
									</div>
								</div>
								<a href="#" class="mv-more-chip" data-bind="visible: !mvAttExpanded() && !mvAttSelecting() && mvAttFit() < listAttachments().length, click: mvAttExpand, text: mvAttShowAllText"></a>
								<a href="#" class="mv-lnk mv-all" data-bind="visible: !mvAttExpanded() && !mvAttSelecting() && downloadAsZipAllowed() && listAttachments().length > 1, click: mvAttDownloadAll"><i class="mi mi-download"></i><span data-bind="text: mvT('MODERN_VIEW/DOWNLOAD_ALL')"></span></a>
							</div>
							<!-- per-attachment ▾ menu (fixed position, outside the scrolling list) -->
							<menu class="dropdown-menu mv-att-menu" data-bind="visible: mvAttMenu, style: { top: mvAttMenuPos().top + 'px', left: mvAttMenuPos().left + 'px' }">
								<li role="presentation" data-bind="visible: mvAttMenu()?.hasPreview()"><a href="#" data-bind="click: () => mvAttAction('preview')"><i class="mi mi-visibility"></i><span data-bind="text: mvT('MODERN_VIEW/PREVIEW')"></span></a></li>
								<li role="presentation"><a href="#" data-bind="click: () => mvAttAction('open')"><i class="mi mi-open-in-new"></i><span data-bind="text: mvT('MESSAGE/BUTTON_IN_NEW_WINDOW')"></span></a></li>
								<li role="presentation"><a href="#" data-bind="click: () => mvAttAction('download')"><i class="mi mi-download"></i><span data-bind="text: mvT('MODERN_VIEW/DOWNLOAD')"></span></a></li>
								<li role="presentation" class="dividerbar" data-bind="visible: mvHasNextcloud"><a href="#" data-bind="click: () => mvAttAction('nextcloud')"><i class="mi mi-cloud-upload"></i><span data-bind="text: mvT('NEXTCLOUD/SAVE_ATTACHMENTS')"></span></a></li>
								<li role="presentation" data-bind="visible: mvAttMenuIsIcs"><a href="#" data-bind="click: () => mvAttAction('calendar')"><i class="mi mi-event"></i><span data-bind="text: mvT('NEXTCLOUD/SAVE_ICS')"></span></a></li>
								<li role="presentation" class="dividerbar" data-bind="visible: listAttachments().length > 1"><a href="#" data-bind="click: () => mvAttAction('select')"><i class="mi mi-check-box"></i><span data-bind="text: mvT('MODERN_VIEW/SELECT')"></span></a></li>
							</menu>
							<!-- kept hidden: the nextcloud plugin appends its Save to Nextcloud / calendar controls here and defines saveNextcloud(), nextcloudSaveICS() -->
							<div class="attachmentsControls" hidden></div>
						</div>

						<div class="btn-toolbar showImages" data-bind="visible: message().hasImages()">
							<div class="btn" data-bind="click: showImages" data-icon="🖼" data-i18n="MESSAGE/BUTTON_SHOW_IMAGES"></div>
							<div class="btn-group dropdown" data-bind="registerBootstrapDropdown: true, visible: showWhitelistOptions" style="display: inline-block">
								<a class="btn dropdown-toggle" id="whitelist-dropdown-id" data-icon="🖼" href="#" tabindex="-1"><span data-i18n="SETTINGS_GENERAL/IMAGES_WHITELIST"></span> ▼</a>
								<menu class="dropdown-menu" role="menu" aria-labelledby="whitelist-dropdown-id">
									<!-- ko foreach: message().whitelistOptions() -->
									<li role="presentation">
										<a href="#" tabindex="-1" data-bind="click: $root.whitelistText, text: $data"></a>
									</li>
									<!-- /ko -->
								</menu>
							</div>
						</div>

						<div class="btn-toolbar" data-bind="visible: message().hasTracking()">
							<div class="btn" data-bind="visible: !nowTracking(), click: showTracking" data-icon="🔗" data-i18n="MESSAGE/ENABLE_TRACKING_LINKS"></div>
							<div class="alert" data-bind="visible: nowTracking" data-i18n="MESSAGE/TRACKING_ENABLED" style="margin:0"></div>
						</div>

						<div data-bind="visible: message().pgpEncrypted()">
							<div class="crypto-control encrypted" data-bind="css: {success: message().pgpDecrypted()}">
								<span data-icon="🔒" data-i18n="OPENPGP/ENCRYPTED_MESSAGE"></span>
								<button class="btn" data-bind="visible: pgpSupported, click: pgpDecrypt" data-i18n="CRYPTO/DECRYPT"></button>
								<div class="alert-error" data-icon="⚠" data-bind="visible: message().pgpEncrypted()?.error, text: message().pgpEncrypted()?.error"></div>
							</div>
						</div>
						<div data-bind="visible: message().pgpSigned()">
							<div class="crypto-control signed" data-bind="css: {success: true === message().pgpSigned()?.success, error: false === message().pgpSigned()?.success}">
								<span data-icon="✍" data-i18n="OPENPGP/SIGNED_MESSAGE"></span>
								<button class="btn" data-bind="visible: pgpSupported, click: pgpVerify" data-i18n="CRYPTO/VERIFY"></button>
								<div data-icon="⚠" data-bind="visible: message().pgpSigned()?.error, text: message().pgpSigned()?.error"></div>
							</div>
						</div>

						<div data-bind="visible: message().smimeEncrypted()">
							<div class="crypto-control encrypted" data-bind="css: {success: message().smimeDecrypted()}">
								<span data-icon="🔒" data-i18n="SMIME/ENCRYPTED_MESSAGE"></span>
								<button class="btn" data-bind="click: smimeDecrypt" data-i18n="CRYPTO/DECRYPT"></button>
								<div class="alert-error" data-icon="⚠" data-bind="visible: message().smimeEncrypted()?.error, text: message().smimeEncrypted()?.error"></div>
							</div>
						</div>
						<div data-bind="visible: message().smimeSigned()">
							<div class="crypto-control signed" data-bind="css: {success: true === message().smimeSigned()?.success, error: false === message().smimeSigned()?.success}">
								<span data-icon="✍" data-i18n="SMIME/SIGNED_MESSAGE"></span>
								<button class="btn" data-bind="click: smimeVerify" data-i18n="CRYPTO/VERIFY"></button>
							</div>
						</div>
					</div>

					<div class="bodyText" dir="auto"></div>
				</div>
			</div>
		</div>
	</div>
</div>
